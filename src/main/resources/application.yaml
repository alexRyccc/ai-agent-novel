spring:
  application:
    name: ai-agent-demo
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: postgres
    password: mysecretpassword
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET hnsw.ef_search = 200
  ai:
    dashscope:
      api-key: sk-2c139a3104f24455976ca70442844681
      chat:
        options:
          model: qwen-turbo
        # 设置连接超时和读取超时（单位：毫秒）
        connect-timeout: 5000
        read-timeout: 30000
      embedding:
        options:
          model: text-embedding-v2
    vectorstore:
      pgvector:

logging:
  level:
    com.sigma.ai_agent_demo: DEBUG   # 你的包名
    org.springframework.ai: DEBUG    # Spring AI 内部日志（可选）
    org.springframework.jdbc: DEBUG  # 查看 SQL 执行（可选）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  charset:
    console: UTF-8
    file: UTF-8
app:
  load-documents-on-startup: true  # 设为 false 可禁用启动加载