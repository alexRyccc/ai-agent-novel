  /* ========================================================================
     可解释性：置信度徽标 / 并列提示 / 分项条形 / 命中词 / 同义词
     —— explain 缺失时全部静默降级（不报错、不白屏、不画空块）
     ======================================================================== */
  function confidenceBadgeHtml(level) {
    if (!level) { return ''; }
    const tone = { '高': 'high', '中': 'mid', '低': 'low' }[level] || 'mid';
    return '<span class="sf-conf sf-conf--' + tone + '" aria-label="置信度：' + escapeHtml(level) + '">'
      + escapeHtml(level) + '</span>';
  }

  /* 把 reason 拆成 [置信度前缀] + 正文 + [并列后缀]，各自独立渲染 */
  function splitReason(raw) {
    const reason = str(raw);
    if (!reason) { return { confidence: null, tie: false, text: '' }; }
    let text = reason;
    let confidence = null;
    const cm = /^\s*\[(高|中|低)\]\s*/.exec(text);
    if (cm) {
      confidence = cm[1];
      text = text.slice(cm[0].length);
    }
    let tie = false;
    const tm = /（存在并列候选[^）]*）\s*$/.exec(text);
    if (tm) {
      tie = true;
      text = text.slice(0, tm.index);
    }
    return { confidence: confidence, tie: tie, text: text };
  }

  /* 分项条形：只用 signals 的饱和分（0~1）画宽度，权重单独标注，不乘不臆造 */
  function signalBarsHtml(exp) {
    if (!exp || typeof exp !== 'object') { return ''; }
    const signals = (exp.signals && typeof exp.signals === 'object') ? exp.signals : {};
    const weights = (exp.weights && typeof exp.weights === 'object') ? exp.weights : {};
    const rows = [
      { key: 'keyword', label: '关键词' },
      { key: 'tag', label: '标签' },
      { key: 'history', label: '历史' }
    ];
    const items = rows.map(function (r) {
      const s = Number(signals[r.key]);
      const w = Number(weights[r.key]);
      const pct = Number.isFinite(s) ? Math.round(Math.min(1, Math.max(0, s)) * 100) : 0;
      const val = Number.isFinite(s) ? s.toFixed(2) : '—';
      const wLabel = Number.isFinite(w) ? ('权重 ' + w.toFixed(2)) : '';
      return '<div class="sf-explain-row">'
        + '<span class="sf-explain-label">' + escapeHtml(r.label) + '</span>'
        + '<span class="sf-explain-track"><span class="sf-explain-fill" style="width:' + pct + '%"></span></span>'
        + '<span class="sf-explain-val">' + val + '</span>'
        + (wLabel ? '<span class="sf-explain-w">' + escapeHtml(wLabel) + '</span>' : '')
        + '</div>';
    }).join('');
    return '<div class="sf-explain-bars">' + items + '</div>';
  }

  function chipListHtml(items) {
    const arr = Array.isArray(items) ? items.map(str).filter(Boolean) : [];
    if (!arr.length) { return ''; }
    return arr.map(function (t) {
      return '<span class="sf-tag">' + escapeHtml(t) + '</span>';
    }).join('');
  }

  function synonymHtml(hits) {
    const arr = Array.isArray(hits) ? hits : [];
    if (!arr.length) { return ''; }
    const chips = arr.map(function (h) {
      const q = str(h && h.query);
      const m = str(h && h.matched);
      const d = Number(h && h.discount);
      const dLabel = Number.isFinite(d) ? ('同义词 ×' + d.toFixed(2)) : '同义词';
      return '<span class="sf-syn-hit">' + escapeHtml(q) + ' → ' + escapeHtml(m)
        + ' · ' + escapeHtml(dLabel) + '</span>';
    }).join('');
    return '<div class="sf-explain-group"><span class="sf-explain-group-label">同义词命中</span>'
      + chips + '</div>';
  }

  function explainHtml(exp) {
    if (!exp || typeof exp !== 'object') { return ''; }
    const bars = signalBarsHtml(exp);
    const kw = chipListHtml(exp.matched_keywords);
    const tg = chipListHtml(exp.matched_tags);
    const syn = synonymHtml(exp.synonym_hits);
    const kwGroup = kw
      ? '<div class="sf-explain-group"><span class="sf-explain-group-label">命中关键词</span>' + kw + '</div>'
      : '';
    const tgGroup = tg
      ? '<div class="sf-explain-group"><span class="sf-explain-group-label">命中标签</span>' + tg + '</div>'
      : '';
    if (!bars && !kwGroup && !tgGroup && !syn) { return ''; }
    return '<div class="sf-explain">' + bars + kwGroup + tgGroup + syn + '</div>';
  }

  function skillForMatch(item) {
    const id = str(item && item.id);
    if (!id) { return null; }
    return state.skills.find(function (s) { return s.id === id; }) || null;
  }

  function shellArg(target) {
    const t = str(target);
    if (!t) { return '""'; }
    return /\s/.test(t) ? ('"' + t + '"') : t;
  }

  function thresholdText() {
    return DEFAULT_THRESHOLD.toFixed(SCORE_DIGITS);
  }

  function matchCardHtml(item, index, href) {
    const reason = splitReason(item.reason);
    const confHtml = confidenceBadgeHtml(reason.confidence);
    const tieHtml = reason.tie
      ? '<p class="sf-tie">存在并列候选：第一名与第二名得分非常接近，请结合实际任务人工判断。</p>'
      : '';
    const reasonHtml = reason.text
      ? '<p class="sf-match-reason">' + escapeHtml(reason.text) + '</p>'
      : '<p class="sf-match-reason">（无命中原因）</p>';

    const pathHtml = item.path
      ? '<code class="sf-path" title="' + escapeHtml(item.path) + '">' + escapeHtml(item.path) + '</code>'
      : '<code class="sf-path sf-path--missing">（服务端未返回路径）</code>';

    const skill = skillForMatch(item);
    const target = str(skill && skill.slug) || str(item.name) || str(item.id);
    const loadCmd = 'sfx load ' + shellArg(target);
    const misfireCmd = loadCmd + ' --misfire';

    const copyPathHtml = item.path
      ? '<button class="sf-copy" type="button" data-copy-text="' + escapeHtml(item.path)
        + '" aria-label="复制技能路径：' + escapeHtml(item.name) + '">复制路径</button>'
      : '';
    const actionsHtml = '<div class="sf-match-actions">'
      + '<button class="sf-copy" type="button" data-copy-cmd="' + escapeHtml(loadCmd)
        + '" aria-label="采纳这个技能：复制命令 ' + escapeHtml(loadCmd) + '">采纳这个技能</button>'
      + '<button class="sf-copy" type="button" data-copy-cmd="' + escapeHtml(misfireCmd)
        + '" aria-label="标记误推荐：复制命令 ' + escapeHtml(misfireCmd) + '">标记误推荐</button>'
      + copyPathHtml
      + '</div>';

    const open = href
      ? '<a class="sf-match" href="' + escapeHtml(href) + '">'
      : '<div class="sf-match">';
    const close = href ? '</a>' : '</div>';

    return [
      open,
      '<div class="sf-match-head">',
      '<h3 class="sf-match-name">' + escapeHtml(item.name) + '</h3>',
      confHtml,
      '<span class="sf-score" title="匹配得分">' + formatScore(item.score) + '</span>',
      '</div>',
      tieHtml,
      reasonHtml,
      explainHtml(item.explain),
      '<div class="sf-match-path">' + pathHtml + '</div>',
      actionsHtml,
      close
    ].join('');
  }

  function renderMatchSuccess(matched) {
    const top = matched.reduce(function (best, item) {
      const s = Number(item.score);
      return (Number.isFinite(s) && s > best) ? s : best;
    }, 0);
    const note = '<p class="sf-threshold-note">当前阈值 ' + thresholdText()
      + '，本次最高分 ' + formatScore(top) + '。命中 ' + matched.length
      + ' 个技能，按得分从高到低。</p>';
    const cards = matched.map(function (item, i) {
      return matchCardHtml(item, i, skillHrefForName(item.name));
    }).join('');
    dom.result.innerHTML = note + '<div class="sf-match-list">' + cards + '</div>';
  }

  function renderMatchFailure(error) {
    const kind = (error && error.kind) ? error.kind : 'unknown';
    const message = str(error && error.message) || '未知错误';

    if (kind === 'timeout') {
      renderMatchState(
        'error',
        '匹配超时',
        escapeHtml(message),
        '本机服务可能正在扫描或数据库被占用。稍等片刻后重试。'
      );
      return;
    }

    if (kind === 'network') {
      renderMatchState(
        'error',
        '无法连接本地服务',
        escapeHtml(message),
        '请确认终端里的 ' + codeTag('sfx serve') + ' 仍在运行，然后重试。'
      );
      return;
    }

    renderMatchState(
      'error',
      '匹配失败',
      escapeHtml(message),
      '空任务会返回「缺少 task」。其余错误请查看运行 ' + codeTag('sfx serve') + ' 的终端输出。'
    );
  }

  /* ========================================================================
     交互：提交匹配
     ======================================================================== */
  function setSubmitBusy(busy) {
    dom.submit.disabled = busy;
    dom.submit.setAttribute('aria-busy', busy ? 'true' : 'false');
    dom.submit.innerHTML = busy
      ? '<span class="sf-spinner" aria-hidden="true"></span><span>' + SPINNER_LABEL + '</span>'
      : SUBMIT_LABEL;
  }

  async function submitMatch() {
    if (state.matchBusy) { return; }
    const task = str(dom.task.value);
    if (!task) {
      renderMatchState(
        'error',
        '请先输入任务描述',
        '任务描述不能为空。',
        '例如：' + codeTag('帮我写一个 Spring Boot 的分页接口') + '。'
      );
      dom.task.focus();
      return;
    }

    rememberLabTask(task);
    state.lastTask = task;
    state.matchBusy = true;
    setSubmitBusy(true);
    renderMatchLoading();

    try {
      const result = await dataSource.match(task);
      const matched = (result && Array.isArray(result.matched))
        ? result.matched
        : (Array.isArray(result) ? result : []);
      state.matches = matched;
      if (matched.length === 0) {
        renderMatchEmpty();
      } else {
        renderMatchSuccess(matched);
      }
    } catch (error) {
      state.matches = [];
      renderMatchFailure(error);
    } finally {
      state.matchBusy = false;
      setSubmitBusy(false);
    }
  }

  function rememberLabTask(task) {
    try {
      const list = readLS(LS.labHistory, []);
      const next = [task].concat(list.filter(function (t) { return t !== task; })).slice(0, 8);
      writeLS(LS.labHistory, next);
    } catch (e) { /* 非关键 */ }
  }

  function getLabHistory() {
    const list = readLS(LS.labHistory, []);
    return Array.isArray(list) ? list : [];
  }

  /* ========================================================================
     交互：复制路径（事件委托，避免内联 onclick）
     ======================================================================== */
  async function onCopyClick(event) {
    const target = event.target;
    if (!(target instanceof Element)) { return; }
    // 采纳 / 误推荐：复制命令并 toast 提示去终端执行
    const cmdButton = target.closest('[data-copy-cmd]');
    if (cmdButton instanceof HTMLButtonElement) {
      event.preventDefault();
      const text = cmdButton.getAttribute('data-copy-cmd');
      const ok = await copyText(text);
      showToast(ok ? ('已复制命令，请在终端执行：' + text) : '复制失败，请手动复制', ok ? 'ok' : 'fail');
      return;
    }
    const button = target.closest('[data-copy-text]');
    if (!(button instanceof HTMLButtonElement)) { return; }
    event.preventDefault();
    const text = button.getAttribute('data-copy-text');
    const succeeded = await copyText(text);
    flashCopyFeedback(button, succeeded);
  }

  /* ========================================================================
     交互：重新加载（显式触发，首屏不请求）
     ======================================================================== */
  async function reloadSkills() {
    if (state.refreshBusy) { return; }
    state.refreshBusy = true;
    if (dom.refresh) { dom.refresh.disabled = true; }
    showGridState(
      'loading',
      '<span class="sf-spinner" aria-hidden="true"></span><span>正在从本机服务重新读取技能列表…</span>'
    );

    try {
      await dataSource.reloadSkills();
      // 技能换了，采纳数据也要重取；loadScores 完成后会自己重排重渲染（含 facet 计数）
      await loadScores();
      showToast('已从本机服务重新读取', 'ok');
      clearStatus('serve-down');
    } catch (error) {
      const message = str(error && error.message) || '未知错误';
      showGridState('error', [
        '<p class="sf-state-title">重新加载失败</p>',
        '<p class="sf-state-body">' + escapeHtml(message) + '</p>',
        '<p class="sf-state-hint">页面仍显示刚才内联的 ' + state.skills.length
          + ' 个技能，可继续浏览。确认 ' + codeTag('sfx serve') + ' 正常后再试。</p>'
      ].join(''));
      if (state.skills.length > 0) {
        dom.grid.hidden = false;
        dom.grid.innerHTML = state.filtered.map(skillCardHtml).join('');
      }
      if (error && error.kind === 'network') {
        setStatus('serve-down', 3,
          '<p class="sf-state-title">本地服务失联</p><p class="sf-state-body">'
          + escapeHtml(message) + '，技能库与匹配暂不可用。</p>',
          { label: '重试连接', run: function () { reloadSkills(); } });
      }
    } finally {
      state.refreshBusy = false;
      if (dom.refresh) { dom.refresh.disabled = false; }
    }
  }

  /* ========================================================================
     路由
     ======================================================================== */
  const ROUTES = [
    { name: 'overview', pattern: /^#\/overview$/, title: '概览' },
    { name: 'library', pattern: /^#\/library(\?[^#]*)?$/, title: '技能库' },
    { name: 'libraryDetail', pattern: /^#\/library\/(.+)$/, title: '技能详情' },
    { name: 'lab', pattern: /^#\/lab$/, title: '路由试验台' },
    { name: 'workbench', pattern: /^#\/workbench$/, title: '工作台' },
    { name: 'workbenchDetail', pattern: /^#\/workbench\/(.+)$/, title: '工作台' },
    { name: 'market', pattern: /^#\/market$/, title: '团队市场' },
    { name: 'settings', pattern: /^#\/settings$/, title: '设置' }
  ];

  function parseRoute() {
    const hash = location.hash || '#/overview';
    for (let i = 0; i < ROUTES.length; i++) {
      const r = ROUTES[i];
      const m = r.pattern.exec(hash);
      if (m) {
        return {
          name: r.name,
          title: r.title,
          param: m[1] ? decodeURIComponent(m[1]) : null
        };
      }
    }
    return { name: 'overview', title: '概览', param: null, fallback: true };
  }

  function updateNav(name) {
    $$('.sf-nav-link', dom.navList).forEach(function (a) {
      const route = a.getAttribute('data-route');
      const on = route === name
        || (name === 'libraryDetail' && route === 'library')
        || (name === 'workbenchDetail' && route === 'workbench');
      a.classList.toggle('is-current', on);
      if (on) { a.setAttribute('aria-current', 'page'); }
      else { a.removeAttribute('aria-current'); }
    });
  }

  function setTopbarTitle(title) {
    dom.pageTitle.textContent = title || '';
  }

  function setTopbarAction(action) {
    dom.topbarAction.innerHTML = '';
    if (!action) { return; }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'sf-btn sf-btn--ghost';
    btn.textContent = action.label;
    btn.addEventListener('click', action.onClick);
    dom.topbarAction.appendChild(btn);
  }

  function announce(message) {
    dom.routeLive.textContent = message;
  }

  function render() {
    const route = parseRoute();
    if (route.fallback) {
      location.replace('#/overview');
      return;
    }
    const page = (typeof pages[route.name] === 'function')
      ? pages[route.name](route.param)
      : pages.overview(null);

    dom.main.innerHTML = page.html;
    document.title = 'SkillForge · ' + (page.title || '');
    setTopbarTitle(page.title || '');
    setTopbarAction(page.action || null);
    updateNav(route.name);

    if (typeof page.mount === 'function') {
      page.mount(route.param);
    }

    // 焦点落到 #sf-main，保证键盘与读屏定位
    dom.main.focus();
    announce('已进入' + (page.title || '页面'));
  }

  /* ========================================================================
     自报条（全局系统状态）
     优先级：error(3) > warn(2) > info(1)；相同 key 本次会话关闭后不再自动弹出
     ======================================================================== */
  function loadDismiss() {
    return readLS(LS.dismiss, {});
  }

  function setStatus(key, priority, html, action) {
    statusState.items[key] = { priority: priority, html: html, action: action || null };
    renderStatus();
  }

  function clearStatus(key) {
    delete statusState.items[key];
    renderStatus();
  }

  function dismissStatus(key) {
    statusState.dismiss[key] = Date.now();
    try { localStorage.setItem(LS.dismiss, JSON.stringify(statusState.dismiss)); } catch (e) { /* ignore */ }
    delete statusState.items[key];
    renderStatus();
  }

  function renderStatus() {
    const active = Object.keys(statusState.items)
      .filter(function (k) { return !statusState.dismiss[k]; })
      .map(function (k) { return Object.assign({ key: k }, statusState.items[k]); })
      .sort(function (a, b) { return b.priority - a.priority; });

    if (active.length === 0) {
      dom.statusbar.hidden = true;
      dom.statusbar.innerHTML = '';
      return;
    }

    const top = active[0];
    const cls = top.priority >= 3 ? 'sf-state--error' : (top.priority === 2 ? 'sf-state--empty' : 'sf-state--info');
    const actionHtml = top.action
      ? '<button class="sf-btn sf-btn--ghost" type="button" data-status-action="1">'
        + escapeHtml(top.action.label) + '</button>'
      : '';
    const closeHtml = '<button class="sf-btn sf-btn--ghost" type="button" data-status-close="1" aria-label="关闭提示">关闭</button>';
    const actions = (actionHtml || closeHtml)
      ? '<div class="sf-status-actions">' + actionHtml + closeHtml + '</div>'
      : '';

    dom.statusbar.hidden = false;
    dom.statusbar.className = 'sf-statusbar';
    dom.statusbar.innerHTML = '<div class="sf-state ' + cls + '">' + top.html + actions + '</div>';
  }

  function bindStatusbar() {
    dom.statusbar.addEventListener('click', function (event) {
      const target = event.target;
      if (!(target instanceof Element)) { return; }
      const closeBtn = target.closest('[data-status-close]');
      if (closeBtn) {
        const key = Object.keys(statusState.items)[0];
        const visible = Object.keys(statusState.items).filter(function (k) { return !statusState.dismiss[k]; });
        if (visible.length) { dismissStatus(visible[0]); }
        return;
      }
      const actionBtn = target.closest('[data-status-action]');
      if (actionBtn) {
        const visible = Object.keys(statusState.items).filter(function (k) { return !statusState.dismiss[k]; });
        if (visible.length) {
          const item = statusState.items[visible[0]];
          if (item && item.action && typeof item.action.run === 'function') { item.action.run(); }
        }
      }
    });
  }

  /* ========================================================================
     主题（深/浅/跟随）
     ======================================================================== */
  function applyTheme() {
    const t = (function () {
      try { return localStorage.getItem(LS.theme); } catch (e) { return null; }
    })();
    if (t === 'dark' || t === 'light') {
      document.documentElement.setAttribute('data-theme', t);
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
  }

  /* ========================================================================
     各页：概览
     ======================================================================== */
  function quickCard(href, ico, title, desc) {

      '<p class="sf-quick-desc">' + escapeHtml(desc) + '</p>',
      '</a>'
    ].join('');
  }

  function activityItemHtml(skill) {
    const meta = ['v' + skill.version];
    if (skill.author) { meta.push(skill.author); }

      '<li><a class="sf-activity-item" href="#/library/',

  function mockScan() {

      + 'sfx scan。</p>', null);

  const pages = {};

  pages.overview = function () {
    const recent = dataSource.recent(LIB_COUNT);
    const recentHtml = recent.length
      ? '<ul class="sf-activity">' + recent.map(activityItemHtml).join('') + '</ul>'

      '<article class="sf-stat"><p class="sf-stat-num" data-stat="total">–</p><p class="sf-stat-label">入库总数</p></article>',
      '<article class="sf-stat"><p class="sf-stat-num sf-stat-num--accent" data-stat="active">–</p><p class="sf-stat-label">已启用</p></article>',

      '</div>',
      '</section>',

      '<section class="sf-panel" aria-labelledby="ov-quick-title">',
      '<div class="sf-panel-head"><h2 class="sf-panel-title" id="ov-quick-title">快捷入口</h2></div>',
      '<div class="sf-grid">',
      quickCard('#/library', '▤', '技能库', '浏览、筛选、搜索全部技能'),
      quickCard('#/lab', '⇄', '路由试验台', '看 SkillForge 如何为任务挑技能'),
      quickCard('#/workbench', '✎', '工作台', '编写与管理 Prompt 草稿'),
      quickCard('#/market', '⧉', '团队市场', '发现并安装团队共享技能'),

      '<section class="sf-panel" aria-labelledby="ov-recent-title">',
      '<div class="sf-panel-head"><h2 class="sf-panel-title" id="ov-recent-title">最近活动</h2>',
      '<span class="sf-panel-note">最近入库 ' + recent.length + ' 个</span></div>',
      recentHtml,
      '</section>',

      '<section class="sf-panel" aria-labelledby="ov-lab-title">',
      '<div class="sf-panel-head"><h2 class="sf-panel-title" id="ov-lab-title">路由试验台</h2>',
      '<a class="sf-btn sf-btn--ghost" href="#/lab">打开完整版</a></div>',
      '<p class="sf-hint">在完整版里输入任务，看 SkillForge 会把哪个技能交给 Metis，并给出命中原因与得分。</p>',
      '</section>'
    ].join('');

    return {
      title: '概览',
      html: html,
      mount: function () {
        renderStatsInto(dom.main, STATS);
        const scannedAt = formatTimestamp(STATS && STATS.last_scanned_at);
        if (!scannedAt) {
          setStatus('never-scanned', 2,
            '<p class="sf-state-title">还没有扫描过技能</p><p class="sf-state-body">运行 '
            + codeTag('sfx scan') + ' 采集本机技能，概览与技能库才会显示数据。</p>',

  /* ========================================================================
     各页：技能库（分类 facet + 工具条 + 网格）
     ======================================================================== */
  const libFacet = { authors: new Set(), tags: new Set(), domains: new Set(), query: '', scoreBand: null };
  let libSortFields = [{ key: 'recent', dir: 1 }];
  let suggestEl = null;
  let suggestItems = [];
  let activeSuggest = -1;

  const SORT_KEYS = ['recent', 'score', 'name', 'version', 'author'];
  const SORT_LABEL = {
    recent: '最近 / 相关度', score: '采纳率', name: '名称', version: '版本', author: '作者'
  };
  const DEFAULT_SORT_FIELDS = [{ key: 'recent', dir: 1 }];
  const SCORE_BAND_LABEL = { data: '有采纳率', insufficient: '数据不足' };

  // v2：旧 key 里存的是按假分为基础的视图（含"高命中率"），换 key 避免把假筛选带过来
  const LIB_VIEWS_LS = 'sf:lib-views:v2';
  const LIB_VIEW_PRESETS = [
    { name: '采纳率优先', facets: {}, query: '', sortFields: [{ key: 'score', dir: -1 }], scoreBand: null },
    { name: '名称排序', facets: {}, query: '', sortFields: [{ key: 'name', dir: 1 }], scoreBand: null }
  ];

  /* 采纳率两态实时计数：每个维度统计「通过除该维度外所有筛选」的技能数 */
  function activeScoreBand() {
    const band = libFacet.scoreBand;
    // 旧版本存下来的 high/mid/low 是按哈希假分算的，直接作废，不做映射
    return (band === 'data' || band === 'insufficient') ? band : null;
  }

  function passesExcept(skill, exceptDim) {
    if (exceptDim !== 'authors' && libFacet.authors.size
      && !libFacet.authors.has(skill.author)) { return false; }
    if (exceptDim !== 'tags' && libFacet.tags.size
      && !skill.tags.some(function (t) { return libFacet.tags.has(t); })) { return false; }
    if (exceptDim !== 'domains' && libFacet.domains.size
      && !skill.tags.some(function (t) { return libFacet.domains.has(tagDomain(t)); })) { return false; }
    const band = activeScoreBand();
    if (exceptDim !== 'score' && band
      && scoreTier(scoreInfo(skill)) !== band) { return false; }
    if (libFacet.query && !matchTerm(skill, libFacet.query)) { return false; }
    return true;
  }

  function computeFacets() {
    const authors = {};
    const tags = {};
    const domains = {};
    const scores = { data: 0, insufficient: 0 };
    state.skills.forEach(function (s) {
      if (passesExcept(s, 'authors') && s.author) { authors[s.author] = (authors[s.author] || 0) + 1; }
      if (passesExcept(s, 'tags')) {
        s.tags.forEach(function (t) { tags[t] = (tags[t] || 0) + 1; });
      }
      if (passesExcept(s, 'domains')) {
        s.tags.forEach(function (t) { const d = tagDomain(t); domains[d] = (domains[d] || 0) + 1; });
      }
      if (passesExcept(s, 'score')) {
        const tier = scoreTier(scoreInfo(s));
        scores[tier] = (scores[tier] || 0) + 1;
      }
    });
    return {
      authors: Object.keys(authors).sort(function (a, b) { return a.localeCompare(b, 'zh'); }).map(function (k) { return { k: k, n: authors[k] }; }),
      tags: Object.keys(tags).sort(function (a, b) { return a.localeCompare(b, 'zh'); }).map(function (k) { return { k: k, n: tags[k] }; }),
      domains: ['Scan', 'Match', 'Prompt', 'Track', 'Deploy', 'Other'].filter(function (d) { return domains[d]; }).map(function (k) { return { k: k, n: domains[k] }; }),
      scores: scores
    };
  }

  function facetOptHtml(type, value, count) {
    let checked = false;
    if (type === 'author') { checked = libFacet.authors.has(value); }
    else if (type === 'tag') { checked = libFacet.tags.has(value); }
    else if (type === 'domain') { checked = libFacet.domains.has(value); }
    else if (type === 'score') { checked = libFacet.scoreBand === value; }
    const label = type === 'score' ? (SCORE_BAND_LABEL[value] || value) : value;
    return '<label class="sf-facet-opt"><input type="checkbox" data-facet="' + type
      + '" value="' + escapeHtml(value) + '"' + (checked ? ' checked' : '') + '>'
      + '<span>' + escapeHtml(label) + '</span>'
      + '<span class="sf-facet-count">' + count + '</span></label>';
  }

  function facetPanelHtml() {
    const f = computeFacets();
    const hasFacets = f.authors.length || f.tags.length || f.domains.length
      || f.scores.data || f.scores.insufficient;
    const scoreGroup = '<div class="sf-facet-group"><span class="sf-facet-legend">按采纳率</span>'
      + ['data', 'insufficient'].map(function (b) { return facetOptHtml('score', b, f.scores[b] || 0); }).join('') + '</div>';
    return [
      '<aside class="sf-facets" aria-label="分类筛选">',
      '<button class="sf-btn sf-btn--ghost sf-facet-all" type="button" id="sf-facet-all">全部</button>',
      hasFacets ? '' : '<p class="sf-hint">暂无可用分类，先 ' + codeTag('sfx scan') + '。</p>',
      f.domains.length ? '<div class="sf-facet-group"><span class="sf-facet-legend">按功能域</span>'
        + f.domains.map(function (d) { return facetOptHtml('domain', d.k, d.n); }).join('') + '</div>' : '',
      f.authors.length ? '<div class="sf-facet-group"><span class="sf-facet-legend">按作者</span>'
        + f.authors.map(function (a) { return facetOptHtml('author', a.k, a.n); }).join('') + '</div>' : '',
      f.tags.length ? '<div class="sf-facet-group"><span class="sf-facet-legend">按标签（多选）</span>'
        + f.tags.map(function (t) { return facetOptHtml('tag', t.k, t.n); }).join('') + '</div>' : '',
      scoreGroup,
      '</aside>'
    ].join('');
  }

  function libMatches(skill) {
    return passesExcept(skill, '');
  }

  function cmpVersion(a, b) {
    const pa = String(a).split('.').map(Number);
    const pb = String(b).split('.').map(Number);
    const len = Math.max(pa.length, pb.length);
    for (let i = 0; i < len; i++) {
      const x = pa[i] || 0;
      const y = pb[i] || 0;
      if (x !== y) { return x - y; }
    }
    return 0;
  }

  /* 多字段稳定排序：按 fields 顺序比较，采纳率默认降序，其余默认升序。
     score 字段的「有数据 / 数据不足」分组不受升降序影响：有真实采纳率的永远在前，
     数据不足的按原始顺序稳定排在后面（Array#sort 稳定 → cmp 归零即保持原序）。 */
  function scoreSortValue(skill) {
    const info = scoreInfo(skill);
    return info.kind === 'rate' ? info.rate : null;
  }

  function sortSkills(list, fields) {
    const arr = list.slice();
    arr.sort(function (a, b) {
      for (let i = 0; i < fields.length; i++) {
        const f = fields[i];
        let cmp = 0;
        if (f.key === 'score') {
          const ra = scoreSortValue(a);
          const rb = scoreSortValue(b);
          if ((ra === null) !== (rb === null)) { return ra === null ? 1 : -1; }
          cmp = (ra === null || rb === null) ? 0 : (ra - rb);
        }
        else if (f.key === 'name') { cmp = a.name.localeCompare(b.name, 'zh'); }
        else if (f.key === 'version') { cmp = cmpVersion(a.version, b.version); }
        else if (f.key === 'author') { cmp = a.author.localeCompare(b.author, 'zh'); }
        else if (f.key === 'recent') { cmp = (a._order - b._order); }
        if (cmp !== 0) { return cmp * f.dir; }
      }
      return 0;
    });
    return arr;
  }

  function applyLibraryFilter() {
    state.query = libFacet.query;
    let list = state.skills.filter(libMatches);
    list = sortSkills(list, libSortFields);
    state.filtered = list;
    renderSkillList();
    updateFacetCounts();
  }

  /* 重新渲染 facet 面板并把计数收敛到当前其它筛选；同时重新绑定复选框 */
  function updateFacetCounts() {
    const aside = $('aside.sf-facets', dom.main);
    if (!aside) { return; }
    aside.outerHTML = facetPanelHtml();
    bindFacetPanel();
  }

  function bindFacetPanel() {
    const all = $('#sf-facet-all', dom.main);
    if (all) {
      all.addEventListener('click', function () { resetFacets(); applyLibraryFilter(); });
    }
    $$('input[data-facet]', dom.main).forEach(function (box) {
      box.addEventListener('change', onFacetChange);
    });
  }

  function onFacetChange() {
    const box = this;
    const type = box.getAttribute('data-facet');
    const val = box.value;
    if (type === 'score') {
      if (box.checked) {
        $$('input[data-facet="score"]', dom.main).forEach(function (o) { if (o !== box) { o.checked = false; } });
        libFacet.scoreBand = val;
      } else {
        libFacet.scoreBand = null;
      }
      applyLibraryFilter();
      return;
    }
    const set = type === 'author' ? libFacet.authors : type === 'tag' ? libFacet.tags : libFacet.domains;
    if (box.checked) { set.add(val); } else { set.delete(val); }
    applyLibraryFilter();
  }

  function resetFacets() {
    libFacet.authors.clear();
    libFacet.tags.clear();
    libFacet.domains.clear();
    libFacet.scoreBand = null;
    libFacet.query = '';
    if (dom.filter) { dom.filter.value = ''; }
    $$('input[data-facet]', dom.main).forEach(function (c) { c.checked = false; });
  }

  /* ========================================================================
     排序浮层 / 视图菜单 / 搜索建议（v2.0 新增）
     ======================================================================== */
  function sortFieldLabel(key) { return SORT_LABEL[key] || key; }

  function renderSortPanel() {
    const panel = $('#sf-lib-sort-panel', dom.main);
    if (!panel) { return; }
    const rows = libSortFields.map(function (field, i) {
      const dirLabel = field.dir === 1 ? '升序' : '降序';
      const upDisabled = i === 0 ? ' disabled' : '';
      const downDisabled = i === libSortFields.length - 1 ? ' disabled' : '';
      return '<div class="sf-sort-row" data-idx="' + i + '">'
        + '<button type="button" class="sf-btn sf-btn--ghost sf-sort-move" data-act="up"' + upDisabled + ' aria-label="上移排序优先级">▲</button>'
        + '<button type="button" class="sf-btn sf-btn--ghost sf-sort-move" data-act="down"' + downDisabled + ' aria-label="下移排序优先级">▼</button>'
        + '<span class="sf-sort-label">' + escapeHtml(sortFieldLabel(field.key)) + '</span>'
        + '<button type="button" class="sf-btn sf-btn--ghost sf-sort-dir" data-act="dir" aria-label="切换升序或降序">' + dirLabel + '</button>'
        + '</div>';
    }).join('');
    const addOpts = SORT_KEYS.map(function (k) {
      return '<option value="' + k + '">' + escapeHtml(sortFieldLabel(k)) + '</option>';
    }).join('');
    panel.innerHTML = rows
      + '<div class="sf-sort-add"><select class="sf-select" id="sf-sort-add">' + addOpts + '</select>'
      + '<button type="button" class="sf-btn sf-btn--ghost" id="sf-sort-add-btn">添加</button></div>'
      + '<button type="button" class="sf-btn sf-btn--ghost" id="sf-sort-reset">重置为默认</button>';

    $$('.sf-sort-row', panel).forEach(function (row) {
      const idx = Number(row.getAttribute('data-idx'));
      row.addEventListener('click', function (e) {
        const act = e.target.getAttribute ? e.target.getAttribute('data-act') : null;
        if (!act) { return; }
        if (act === 'up' && idx > 0) {
          const tmp = libSortFields[idx - 1]; libSortFields[idx - 1] = libSortFields[idx]; libSortFields[idx] = tmp;
        } else if (act === 'down' && idx < libSortFields.length - 1) {
          const tmp = libSortFields[idx + 1]; libSortFields[idx + 1] = libSortFields[idx]; libSortFields[idx] = tmp;
        } else if (act === 'dir') {
          libSortFields[idx].dir = libSortFields[idx].dir === 1 ? -1 : 1;
        } else { return; }
        renderSortPanel();
        applyLibraryFilter();
      });
    });
    const addSel = $('#sf-sort-add', panel);
    const addBtn = $('#sf-sort-add-btn', panel);
    if (addBtn) {
      addBtn.addEventListener('click', function () {
        const key = addSel ? addSel.value : null;
        if (!key) { return; }
        const dir = key === 'score' ? -1 : 1;
        libSortFields.push({ key: key, dir: dir });
        renderSortPanel();
        applyLibraryFilter();
      });
    }
    const resetBtn = $('#sf-sort-reset', panel);
    if (resetBtn) {
      resetBtn.addEventListener('click', function () {
        libSortFields = DEFAULT_SORT_FIELDS.slice();
        renderSortPanel();
        applyLibraryFilter();
      });
    }
  }

  function loadViews() {
    const saved = readLS(LIB_VIEWS_LS, null);
    if (Array.isArray(saved)) { return saved; }
    writeLS(LIB_VIEWS_LS, LIB_VIEW_PRESETS);
    return LIB_VIEW_PRESETS.slice();
  }

  function saveViews(arr) { return writeLS(LIB_VIEWS_LS, arr); }

  function applyView(view) {
    if (!view) { return; }
    libFacet.authors.clear();
    libFacet.tags.clear();
    libFacet.domains.clear();
    libFacet.scoreBand = view.scoreBand || null;
    libFacet.query = view.query || '';
    const facets = view.facets || {};
    (facets.authors || []).forEach(function (a) { libFacet.authors.add(a); });
    (facets.tags || []).forEach(function (t) { libFacet.tags.add(t); });
    (facets.domains || []).forEach(function (d) { libFacet.domains.add(d); });
    libSortFields = (Array.isArray(view.sortFields) && view.sortFields.length)
      ? view.sortFields.map(function (f) { return { key: f.key, dir: f.dir === -1 ? -1 : 1 }; })
      : DEFAULT_SORT_FIELDS.slice();
    if (dom.filter) { dom.filter.value = libFacet.query; }
    applyLibraryFilter();
  }

  function saveCurrentView() {
    const name = window.prompt('为当前视图命名：');
    if (!name) { return; }
    const views = loadViews();
    views.push({
      name: name,
      facets: {
        authors: Array.from(libFacet.authors),
        tags: Array.from(libFacet.tags),
        domains: Array.from(libFacet.domains)
      },
      query: libFacet.query || '',
      sortFields: libSortFields.map(function (f) { return { key: f.key, dir: f.dir }; }),
      scoreBand: libFacet.scoreBand || null
    });
    saveViews(views);
    renderViewsMenu();
    showToast('已保存视图：' + name, 'ok');
  }

  function renderViewsMenu() {
    const menu = $('#sf-lib-views', dom.main);
    if (!menu) { return; }
    const views = loadViews();
    if (!views.length) {
      menu.innerHTML = '<p class="sf-view-empty">（暂无保存的视图）</p>';
      return;
    }
    menu.innerHTML = views.map(function (v, i) {
      return '<button type="button" class="sf-view-item" data-view="' + i + '">'
        + '<span class="sf-view-name">' + escapeHtml(v.name) + '</span>'
        + '<span class="sf-view-del" data-del="' + i + '" aria-label="删除视图 ' + escapeHtml(v.name) + '" title="删除">×</span>'
        + '</button>';
    }).join('')
      + '<button type="button" class="sf-btn sf-btn--ghost sf-view-save" id="sf-view-save">保存当前视图…</button>';

    $$('.sf-view-item', menu).forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        const delAttr = e.target.getAttribute ? e.target.getAttribute('data-del') : null;
        if (delAttr !== null) {
          const di = Number(delAttr);
          const vs = loadViews();
          vs.splice(di, 1);
          saveViews(vs);
          renderViewsMenu();
          return;
        }
        const vi = Number(btn.getAttribute('data-view'));
        const v = loadViews()[vi];
        if (v) { applyView(v); closeLibraryPopovers(); }
      });
    });
    const saveBtn = $('#sf-view-save', menu);
    if (saveBtn) {
      saveBtn.addEventListener('click', function () { saveCurrentView(); closeLibraryPopovers(); });
    }
  }

  function closeLibraryPopovers() {
    const sb = $('#sf-lib-sort-btn', dom.main);
    const sp = $('#sf-lib-sort-panel', dom.main);
    const vb = $('#sf-lib-views-btn', dom.main);
    const vm = $('#sf-lib-views', dom.main);
    if (sb) { sb.setAttribute('aria-expanded', 'false'); }
    if (sp) { sp.hidden = true; }
    if (vb) { vb.setAttribute('aria-expanded', 'false'); }
    if (vm) { vm.hidden = true; }
  }

  function computeSuggest(q) {
    if (!q) { return []; }
    const out = [];
    const seen = {};
    state.skills.forEach(function (s) {
      if (matchTerm(s, q) && !seen['name:' + s.name]) {
        seen['name:' + s.name] = true;
        out.push({ text: s.name, type: 'name' });
      }
      s.tags.forEach(function (t) {
        const tl = t.toLowerCase();
        if ((tl.indexOf(q) !== -1 || pinyinOf(t).indexOf(q) !== -1) && !seen['tag:' + t]) {
          seen['tag:' + t] = true;
          out.push({ text: t, type: 'tag' });
        }
      });
    });
    return out.slice(0, 8);
  }

  function renderSuggest(items) {
    suggestItems = items;
    activeSuggest = -1;
    if (!suggestEl) { return; }
    if (!items.length) { hideSuggest(); return; }
    suggestEl.innerHTML = items.map(function (it, i) {
      return '<button type="button" class="sf-suggest-item" data-i="' + i + '">'
        + escapeHtml(it.text)
        + ' <span class="sf-hint">' + (it.type === 'name' ? '技能' : '标签') + '</span></button>';
    }).join('');
    suggestEl.hidden = false;
    $$('.sf-suggest-item', suggestEl).forEach(function (btn) {
      btn.addEventListener('mousedown', function (e) {
        e.preventDefault();
        const i = Number(btn.getAttribute('data-i'));
        pickSuggest(items[i]);
      });
    });
  }

  function moveSuggest(dir) {
    if (!suggestItems.length || !suggestEl) { return; }
    activeSuggest = (activeSuggest + dir + suggestItems.length) % suggestItems.length;
    const nodes = $$('.sf-suggest-item', suggestEl);
    nodes.forEach(function (n, i) { n.classList.toggle('is-active', i === activeSuggest); });
    const active = nodes[activeSuggest];
    if (active && active.scrollIntoView) { active.scrollIntoView({ block: 'nearest' }); }
  }

  function pickSuggest(item) {
    if (!item || !dom.filter) { return; }
    dom.filter.value = item.text;
    libFacet.query = str(item.text).toLowerCase();
    hideSuggest();
    applyLibraryFilter();
    dom.filter.focus();
  }

  function hideSuggest() {
    if (suggestEl) { suggestEl.hidden = true; }
    activeSuggest = -1;
    suggestItems = [];
  }

  function computeAndShowSuggest(q) {
    if (!q) { hideSuggest(); return; }
    renderSuggest(computeSuggest(q));
  }

  function applyViewFromHash() {
    const hash = location.hash || '';
    const m = /[?&]view=([^&]+)/.exec(hash);
    if (!m) { return; }
    const name = decodeURIComponent(m[1]);
    const v = loadViews().find(function (x) { return x.name === name; });
    if (v) { applyView(v); showToast('已套用视图：' + name, 'ok'); }
  }

        });

        dom.filter.addEventListener('input', function () {
          window.clearTimeout(filterTimer);
          filterTimer = window.setTimeout(function () {
            libFacet.query = str(dom.filter.value).toLowerCase();
            applyLibraryFilter();
            computeAndShowSuggest(libFacet.query);
          }, FILTER_DEBOUNCE_MS);
        });

        dom.filter.addEventListener('keydown', function (e) {
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            if (!suggestEl.hidden) { e.preventDefault(); moveSuggest(e.key === 'ArrowDown' ? 1 : -1); }
            return;
          }
          if (e.key === 'Enter') {
            if (activeSuggest !== -1 && suggestItems[activeSuggest]) {
              e.preventDefault();
              pickSuggest(suggestItems[activeSuggest]);
            }
            return;
          }
          if (e.key === 'Escape') {
            if (!suggestEl.hidden) { hideSuggest(); e.preventDefault(); return; }
            if (dom.filter.value) {
              e.preventDefault();
              dom.filter.value = '';

            }
          }
        });

        dom.filter.addEventListener('blur', function () {
          window.setTimeout(hideSuggest, 120);
        });

        dom.refresh.addEventListener('click', function () { reloadSkills(); });

        dom.filterClear.addEventListener('click', function () {
          resetFacets();
          applyLibraryFilter();
          dom.filter.focus();
        });

        applyViewFromHash();

        applyLibraryFilter();
      }
    };

  /* ========================================================================
     各页：工作台（mock）
     ======================================================================== */
  const wbState = { items: [], currentId: null, lastSaved: null, dirty: false };

  function addToWorkbench(skill) {
    const items = dataSource.workbenchList().slice();
    const id = 'wb-' + Date.now().toString(36);
    items.unshift({
      id: id, name: skill.name, description: skill.summary || '由技能库加入的草稿',
      source: 'local', updatedAt: nowIso(), body: skill.summary || ''
    });
    dataSource.workbenchSave(items);
    wbState.items = items;
    wbState.currentId = id;
    wbState.lastSaved = findWb(id);
    wbState.dirty = false;
    renderWorkbenchEditor();
  }

  function findWb(id) {
    return wbState.items.find(function (x) { return x.id === id; }) || null;
  }

  function renderWorkbenchList() {
    const listEl = $('#sf-wb-list', dom.main);
    if (!listEl) { return; }
    if (!wbState.items.length) {
      listEl.innerHTML = '<p class="sf-hint">还没有草稿，点「新建 Prompt」开始。</p>';
      return;
    }
    listEl.innerHTML = wbState.items.map(function (it) {
      return '<button class="sf-wb-item' + (it.id === wbState.currentId ? ' is-current' : '')
        + '" type="button" data-wb-id="' + escapeHtml(it.id) + '">'
        + '<span class="sf-wb-item-name">' + escapeHtml(it.name) + '</span>'
        + '<span class="sf-wb-item-src">' + escapeHtml(it.source === 'team' ? '团队' : '本机') + '</span>'
        + '</button>';
    }).join('');
    $$('.sf-wb-item', listEl).forEach(function (btn) {
      btn.addEventListener('click', function () {
        selectWorkbench(btn.getAttribute('data-wb-id'));
      });
    });
  }

  function renderWorkbenchEditor() {
    const wrap = $('#sf-wb-editor', dom.main);
    if (!wrap) { return; }
    const current = findWb(wbState.currentId);
    if (!current) {
      wrap.innerHTML = '<div class="sf-state sf-state--empty"><p class="sf-state-title">未选择草稿</p>'
        + '<p class="sf-state-body">从左侧选择一项，或点「新建 Prompt」。</p></div>';
      return;
    }
    wrap.innerHTML = [
      '<div class="sf-wb-fields">',
      '<div class="sf-field"><label class="sf-sr-only" for="sf-wb-name">名称</label>',
      '<input class="sf-input" id="sf-wb-name" value="' + escapeHtml(current.name) + '" placeholder="Prompt 名称"></div>',
      '<div class="sf-field"><label class="sf-sr-only" for="sf-wb-desc">描述</label>',
      '<input class="sf-input" id="sf-wb-desc" value="' + escapeHtml(current.description || '') + '" placeholder="一句话描述"></div>',
      '</div>',
      '<div class="sf-wb-split">',
      '<div class="sf-field"><label class="sf-sr-only" for="sf-wb-body">正文（支持 {{变量}}）</label>',
      '<textarea class="sf-textarea" id="sf-wb-body" aria-describedby="sf-wb-preview-hint">' + escapeHtml(current.body) + '</textarea></div>',
      '<div class="sf-field"><span class="sf-sr-only" id="sf-wb-preview-hint">实时预览</span>',
      '<div class="sf-preview" id="sf-wb-preview" aria-live="polite"></div></div>',
      '</div>',
      '<div class="sf-wb-foot">',
      '<span class="sf-dirty-dot" id="sf-wb-dirty"' + (wbState.dirty ? '' : ' hidden') + '>未保存</span>',
      '<span class="sf-hint" id="sf-wb-updated">更新于 ' + escapeHtml(current.updatedAt || '—') + '</span>',
      '<button class="sf-btn sf-btn--ghost" type="button" id="sf-wb-reset">重置</button>',
      '<button class="sf-btn sf-btn--ghost sf-btn--danger" type="button" id="sf-wb-delete">删除</button>',
      '<button class="sf-btn" type="button" id="sf-wb-save">保存</button>',
      '</div>'
    ].join('');

    const nameEl = $('#sf-wb-name', wrap);
    const descEl = $('#sf-wb-desc', wrap);
    const bodyEl = $('#sf-wb-body', wrap);
    const previewEl = $('#sf-wb-preview', wrap);

    function renderPreview() {
      const v = bodyEl.value;
      const safe = escapeHtml(v);
      previewEl.innerHTML = safe.replace(/\{\{\s*([^}]+?)\s*\}\}/g,
        function (_, name) { return '<span class="sf-var">{{' + escapeHtml(name) + '}}</span>'; });
    }
    function markDirty() {
      wbState.dirty = true;
      const d = $('#sf-wb-dirty', wrap);
      if (d) { d.hidden = false; }
    }
    nameEl.addEventListener('input', markDirty);
    descEl.addEventListener('input', markDirty);
    bodyEl.addEventListener('input', function () { markDirty(); renderPreview(); });
    renderPreview();

    $('#sf-wb-save', wrap).addEventListener('click', function () { saveWorkbench(); });
    $('#sf-wb-reset', wrap).addEventListener('click', function () { selectWorkbench(wbState.currentId); });
    $('#sf-wb-delete', wrap).addEventListener('click', function () { deleteWorkbench(); });
  }

  function selectWorkbench(id) {
    wbState.currentId = id;
    wbState.lastSaved = findWb(id);
    wbState.dirty = false;
    renderWorkbenchList();
    renderWorkbenchEditor();
  }

  function saveWorkbench() {
    const current = findWb(wbState.currentId);
    if (!current) { return; }
    const nameEl = $('#sf-wb-name', dom.main);
    const descEl = $('#sf-wb-desc', dom.main);
    const bodyEl = $('#sf-wb-body', dom.main);
    if (!nameEl || !bodyEl) { return; }

    const snapshot = { name: current.name, description: current.description, body: current.body };
    current.name = str(nameEl.value) || '未命名 Prompt';
    current.description = str(descEl ? descEl.value : '');
    current.body = bodyEl.value;
    current.updatedAt = nowIso();

    const saved = dataSource.workbenchSave(wbState.items);
    if (!saved) {
      // 失败回滚
      current.name = snapshot.name;
      current.description = snapshot.description;
      current.body = snapshot.body;
      showToast('保存失败，已回滚', 'fail');
      return;
    }
    wbState.dirty = false;
    wbState.lastSaved = findWb(wbState.currentId);
    const d = $('#sf-wb-dirty', dom.main);
    if (d) { d.hidden = true; }
    const u = $('#sf-wb-updated', dom.main);
    if (u) { u.textContent = '更新于 ' + current.updatedAt; }
    renderWorkbenchList();
    showToast('已保存', 'ok');
  }

  function deleteWorkbench() {
    const current = findWb(wbState.currentId);
    if (!current) { return; }
    if (!window.confirm('确定删除「' + current.name + '」？此操作不可撤销。')) { return; }
    wbState.items = wbState.items.filter(function (x) { return x.id !== current.id; });
    dataSource.workbenchSave(wbState.items);
    wbState.currentId = wbState.items.length ? wbState.items[0].id : null;
    wbState.lastSaved = wbState.currentId ? findWb(wbState.currentId) : null;
    wbState.dirty = false;
    renderWorkbenchList();
    renderWorkbenchEditor();
    showToast('已删除', 'ok');
  }

  function newWorkbench() {
    const items = dataSource.workbenchList().slice();
    const id = 'wb-' + Date.now().toString(36);
    items.unshift({
      id: id, name: '未命名 Prompt', description: '', source: 'local',
      updatedAt: nowIso(), body: '任务：{{task}}\n\n输出：'
    });
    dataSource.workbenchSave(items);
    wbState.items = items;
    selectWorkbench(id);
  }

  /* 工作台骨架：pages.workbench 与 pages.workbenchDetail 共用一份，
     避免 sf-wb-new / sf-wb-list / sf-wb-editor / wb-title 在源码里出现两次 */
  function workbenchSectionHtml() {

      '<button class="sf-btn sf-btn--ghost" type="button" id="sf-wb-new">新建</button></div>',

  pages.workbench = function () {
    wbState.items = dataSource.workbenchList();
    wbState.currentId = wbState.items.length ? wbState.items[0].id : null;

      title: '工作台',
      html: html,
      action: { label: '新建 Prompt', onClick: newWorkbench },

        renderWorkbenchList();
        renderWorkbenchEditor();
      }

  pages.workbenchDetail = function (id) {
    // 深链：直接定位到指定草稿
    wbState.items = dataSource.workbenchList();
    const found = wbState.items.find(function (x) { return x.id === id; });
    wbState.currentId = found ? id : (wbState.items.length ? wbState.items[0].id : null);
    wbState.lastSaved = wbState.currentId ? findWb(wbState.currentId) : null;
    wbState.dirty = false;

    const html = workbenchSectionHtml();

    return {
      title: '工作台',
      html: html,
      action: { label: '新建 Prompt', onClick: newWorkbench },

        renderWorkbenchEditor();

  /* ========================================================================
     各页：团队市场（mock）
     ======================================================================== */
  const marketState = { source: 'local', query: '', tag: '', sort: 'rating' };

  function marketMatches(item) {
    if (marketState.source && item.source !== marketState.source) { return false; }
    if (marketState.tag && item.tags.indexOf(marketState.tag) === -1) { return false; }
    if (marketState.query) {
      const q = marketState.query.toLowerCase();
      const hay = (item.name + ' ' + item.summary + ' ' + item.author + ' ' + item.tags.join(' ')).toLowerCase();
      if (hay.indexOf(q) === -1) { return false; }
    }
    return true;
  }

  function marketCardHtml(item) {
    const tagsHtml = item.tags.length
      ? '<ul class="sf-tags">' + item.tags.map(function (t) {
          return '<li class="sf-tag">' + escapeHtml(t) + '</li>';
        }).join('') + '</ul>'
      : '';
    return [
      '<article class="sf-card">',
      '<div class="sf-card-head">',
      '<span class="sf-avatar" aria-hidden="true">' + escapeHtml(firstChar(item.name)) + '</span>',
      '<div class="sf-card-title"><h3 class="sf-card-name">' + escapeHtml(item.name) + '</h3>',
      '<p class="sf-card-meta">' + escapeHtml(item.author) + ' · <span class="sf-market-rate" title="演示评分，不是真实用户评价">★ '
        + item.rating.toFixed(1) + ' · 示例</span></p>',
      '</div></div>',
      '<p class="sf-summary sf-summary--full">' + escapeHtml(item.summary) + '</p>',
      tagsHtml,
      '<div class="sf-card-foot"><button class="sf-btn sf-btn--ghost" type="button" data-market-id="'
        + escapeHtml(item.id) + '">安装到本机</button></div>',
      '</article>'
    ].join('');
  }

  function allMarketTags() {
    const set = {};
    dataSource.marketList().forEach(function (m) {
      m.tags.forEach(function (t) { set[t] = true; });
    });
    return Object.keys(set).sort(function (a, b) { return a.localeCompare(b, 'zh'); });
  }

  pages.market = function () {
    const tags = allMarketTags();
    const tagOpts = ['<option value="">全部标签</option>'].concat(tags.map(function (t) {
      return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>';
    })).join('');

    const html = [
      '<section class="sf-panel" aria-labelledby="mk-title">',

      '<div class="sf-toolbar">',
      '<div class="sf-segment" role="group" aria-label="来源切换">',
      '<button type="button" data-source="local" class="is-on">本机推荐</button>',
      '<button type="button" data-source="team">团队共享</button>',
      '</div>',
      '<div class="sf-field"><label class="sf-sr-only" for="sf-mk-search">搜索市场</label>',
      '<input class="sf-input" id="sf-mk-search" type="search" autocomplete="off" placeholder="搜索名称 / 作者 / 标签"></div>',
      '<div class="sf-field" style="flex:0 0 auto"><label class="sf-sr-only" for="sf-mk-tag">按标签筛选</label>',
      '<select class="sf-select" id="sf-mk-tag">' + tagOpts + '</select></div>',
      '<div class="sf-field" style="flex:0 0 auto"><label class="sf-sr-only" for="sf-mk-sort">排序</label>',
      '<select class="sf-select" id="sf-mk-sort">',
      '<option value="rating">评分高到低</option>',
      '<option value="name">名称 A–Z</option>',
      '</select></div>',
      '</div>',
      '<div class="sf-grid" id="sf-mk-grid"></div>',
      '<div class="sf-state" id="sf-mk-state" hidden></div>',
      '</section>'
    ].join('');

    return {
      title: '团队市场',
      html: html,
      action: { label: '刷新市场', onClick: function () { renderMarket(); showToast('已刷新市场（mock）', 'ok'); } },
      mount: function () {
        const grid = $('#sf-mk-grid', dom.main);
        const stateEl = $('#sf-mk-state', dom.main);
        const search = $('#sf-mk-search', dom.main);
        const tagSel = $('#sf-mk-tag', dom.main);
        const sortSel = $('#sf-mk-sort', dom.main);

        function renderMarketInner() {
          let list = dataSource.marketList().filter(marketMatches);
          if (marketState.sort === 'name') {
            list.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
          } else {
            list.sort(function (a, b) { return b.rating - a.rating; });
          }
          if (list.length === 0) {
            stateEl.hidden = false;
            stateEl.className = 'sf-state sf-state--empty';
            stateEl.innerHTML = '<p class="sf-state-title">没有匹配的市场技能</p>'
              + '<p class="sf-state-body">换一个来源、标签或关键词试试。</p>';
            grid.hidden = true;
            return;
          }
          grid.hidden = false;
          stateEl.hidden = true;
          grid.innerHTML = list.map(marketCardHtml).join('');
        }
        window.__renderMarket = renderMarketInner;

        $$('button[data-source]', dom.main).forEach(function (btn) {
          btn.addEventListener('click', function () {
            marketState.source = btn.getAttribute('data-source');
            $$('button[data-source]', dom.main).forEach(function (b) {
              b.classList.toggle('is-on', b === btn);
            });
            renderMarketInner();
          });
        });

        search.addEventListener('input', function () {
          window.clearTimeout(filterTimer);
          filterTimer = window.setTimeout(function () {
            marketState.query = str(search.value).toLowerCase();
            renderMarketInner();
          }, FILTER_DEBOUNCE_MS);
        });
        tagSel.addEventListener('change', function () { marketState.tag = tagSel.value; renderMarketInner(); });
        sortSel.addEventListener('change', function () { marketState.sort = sortSel.value; renderMarketInner(); });

        grid.addEventListener('click', function (e) {
          const t = e.target;
          if (!(t instanceof Element)) { return; }
          const btn = t.closest('[data-market-id]');
          if (!btn) { return; }
          const id = btn.getAttribute('data-market-id');
          installMarket(id);
        });

        renderMarketInner();
      }
    };
  };

  function renderMarket() {
    if (window.__renderMarket) { window.__renderMarket(); }
  }

  function installMarket(id) {
    const item = dataSource.marketList().find(function (m) { return m.id === id; });
    if (!item) { return; }
    const items = dataSource.workbenchList().slice();
    if (items.some(function (x) { return x.id === 'mk-' + id; })) {
      showToast('该技能已在草稿中', 'ok');
      return;
    }
    items.unshift({
      id: 'mk-' + id, name: item.name, description: item.summary,
      source: 'team', updatedAt: nowIso(), body: item.summary || ''
    });
    dataSource.workbenchSave(items);
    showToast('已安装「' + item.name + '」到本机草稿', 'ok');
  }

    return {
      title: '设置',
      html: html,
      mount: function () {
        $$('input[name="sf-theme"]', dom.main).forEach(function (radio) {
          radio.addEventListener('change', function () {
            if (!radio.checked) { return; }
            try { localStorage.setItem(LS.theme, radio.value); } catch (e) { /* ignore */ }
            applyTheme();
            showToast('主题已设为' + ({ auto: '跟随系统', dark: '深', light: '浅' })[radio.value], 'ok');
          });
        });
        $('#sf-set-sort', dom.main).addEventListener('change', function (e) {
          const next = Object.assign({}, dataSource.settingsGet(), { defaultSort: e.target.value });
          dataSource.settingsSave(next);
          const sortMap = {
            recent: [{ key: 'recent', dir: 1 }],
            name: [{ key: 'name', dir: 1 }],
            version: [{ key: 'version', dir: -1 }],
            author: [{ key: 'author', dir: 1 }]
          };
          if (sortMap[e.target.value]) {
            libSortFields = sortMap[e.target.value];
            if (dom.filter && $('#sf-lib-grid', dom.main)) { applyLibraryFilter(); }
          }
          showToast('默认排序已保存', 'ok');
        });
        $('#sf-set-scan', dom.main).addEventListener('click', function () {
          showToast('演示按钮：真实扫描请在终端运行 sfx scan', 'ok');
        });
      }
    };
  };

  /* ========================================================================
     抽屉 + 折叠（持久化 shell 交互）
     ======================================================================== */
  function openDrawer() {
    dom.app.classList.add('nav-open');
    dom.scrim.hidden = false;
    dom.hamburger.setAttribute('aria-expanded', 'true');
    const first = dom.side.querySelector('.sf-nav-link');
    if (first) { window.setTimeout(function () { first.focus(); }, 0); }
  }

  function closeDrawer() {
    dom.app.classList.remove('nav-open');
    dom.scrim.hidden = true;
    dom.hamburger.setAttribute('aria-expanded', 'false');
    dom.hamburger.focus();
  }

  function toggleDrawer() {
    if (dom.app.classList.contains('nav-open')) { closeDrawer(); }
    else { openDrawer(); }
  }

  function trapFocus(event) {
    if (!dom.app.classList.contains('nav-open')) { return; }
    if (event.key !== 'Tab') { return; }
    const focusables = $$('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])', dom.side)
      .filter(function (el) { return el.offsetParent !== null; });
    if (!focusables.length) { return; }
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }

  function bindShell() {
    dom.hamburger.addEventListener('click', toggleDrawer);
    dom.scrim.addEventListener('click', closeDrawer);
    dom.collapse.addEventListener('click', function () {
      const collapsed = dom.app.classList.toggle('is-collapsed');
      dom.collapse.setAttribute('aria-pressed', collapsed ? 'true' : 'false');
      dom.collapse.setAttribute('aria-label', collapsed ? '展开侧边栏' : '折叠侧边栏');
      dom.collapse.textContent = collapsed ? '»' : '«';
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && dom.app.classList.contains('nav-open')) {
        closeDrawer();
        return;
      }
      trapFocus(event);
    });

    // 全局搜索 → 进入技能库并预填过滤词
    dom.gsearchForm.addEventListener('submit', function (e) {
      e.preventDefault();
      pendingQuery = str(dom.gsearch.value);
      dom.gsearch.value = '';
      if (location.hash === '#/library') {
        // 已在库内：直接应用
        if (dom.filter) {
          dom.filter.value = pendingQuery;
          libFacet.query = pendingQuery.toLowerCase();
          pendingQuery = '';
          applyLibraryFilter();
        }
      } else {
        location.hash = '#/library';
      }
    });

    // 复制按钮委托（覆盖所有页）
    dom.main.addEventListener('click', onCopyClick);

    // 侧栏导航点击后关闭抽屉
    dom.navList.addEventListener('click', function (e) {
      if (e.target.closest('.sf-nav-link') && dom.app.classList.contains('nav-open')
        && window.matchMedia('(max-width: 767px)').matches) {
        // 延迟关闭，让 hashchange 先发生
        window.setTimeout(closeDrawer, 0);
      }
    });

    bindStatusbar();

    // 库内浮层（排序 / 视图）点击外部关闭；浮层自身在 .sf-pop 内，不触发关闭
    document.addEventListener('click', function (e) {
      if (!e.target || !(e.target instanceof Element)) { return; }
      if (e.target.closest('.sf-pop')) { return; }
      closeLibraryPopovers();
    });

    window.addEventListener('hashchange', render);
  }

  /* ========================================================================
     绑定与启动
     ======================================================================== */
  function init() {
    cacheDom();
    bindShell();
    applyTheme();

    state.skills = normalizeSkills(SKILLS);
    state.filtered = state.skills.slice();

    render();

    // 首屏先按「数据不足」渲染，/api/scores 回来后再原地更新（不空白、不占位 0）
    loadScores();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
